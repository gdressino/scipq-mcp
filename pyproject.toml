[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "scipq-mcp"
version = "0.1.0"
description = "MCP server for Java code navigation over the per-file SCIP shards written by scip-javac, with no index held in memory."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Germán Dressino" }]
keywords = ["mcp", "model-context-protocol", "scip", "java", "code-navigation", "lsp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Java",
    "Topic :: Software Development",
]
dependencies = ["mcp>=1.2"]

[project.urls]
Homepage = "https://github.com/gdressino/scipq-mcp"
Issues = "https://github.com/gdressino/scipq-mcp/issues"

[project.scripts]
scipq-mcp = "scipq_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/scipq_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md"]
exclude = ["tests/fixtures/.jars"]

[tool.pytest.ini_options]
testpaths = ["tests"]

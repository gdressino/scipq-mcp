[profile]
name = "junit"
description = "JUnit 4 and 5 tests"

[[entry_points]]
kind = "test"
annotations = [
  "org.junit.jupiter.api.Test", "org.junit.jupiter.api.ParameterizedTest",
  "org.junit.jupiter.params.ParameterizedTest", "org.junit.jupiter.api.RepeatedTest",
  "org.junit.jupiter.api.TestFactory", "org.junit.jupiter.api.TestTemplate",
  "org.junit.jupiter.api.BeforeEach", "org.junit.jupiter.api.AfterEach",
  "org.junit.jupiter.api.BeforeAll", "org.junit.jupiter.api.AfterAll",
  "org.junit.jupiter.api.Nested", "org.junit.jupiter.params.provider.MethodSource",
  "org.junit.Test", "org.junit.Before", "org.junit.After", "org.junit.BeforeClass",
  "org.junit.AfterClass", "org.junit.Rule", "org.junit.ClassRule",
]
type_names = ["*Test", "*Tests", "*IT"]
